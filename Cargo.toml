[package]
name = "aj-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Web client for ada-judge (Dioxus + daisyUI) — port of aj-app (Slint)"
license = "MIT"

[lib]
name = "aj_web"
crate-type = ["rlib", "cdylib"]

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-web = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
futures-util = "0.3"
gloo-timers = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "HtmlAnchorElement",
    "HtmlDocument",
    "HtmlElement",
    "HtmlInputElement",
    "Url",
    "Document",
    "Element",
    "Node",
    "MouseEvent",
    "FileList",
    "File",
    "Storage",
    "Window",
] }
gloo-net = { version = "0.6", features = ["websocket"] }
log = "0.4"
console_error_panic_hook = "0.1"
aj-models = "0.10.11"
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"

[profile.release]
codegen-units = 1
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
strip = true
